[flake8]
max-line-length = 99
exclude = .git,__pycache__,build,install,log,baseline/lyra_control
# W503/W504: line break before/after binary operator - mutually contradictory.
# E731: assigning a lambda is fine where it reads better than a def.
extend-ignore = W503,W504,E731
per-file-ignores =
    tests/*:E501
