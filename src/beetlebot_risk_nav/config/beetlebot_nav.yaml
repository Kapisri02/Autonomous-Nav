# BeetleBot navigation parameters.
#
# Generated from beetlebot_risk_nav.core.params.NavConfig - the defaults here
# are exactly the defaults in code. Override only what you need.
#
# VERIFIED VALUES - do not treat these as tuning knobs:
#   robot.footprint_length/width : 0.375 x 0.360 m, VEEROBOT documentation
#   robot.robot_radius           : 0.22 m, from the robot nav2_params.yaml

beetlebot_nav:
  ros__parameters:
    # --- interfaces ---
    scan_topic: "/scan"
    odom_topic: "/odom"
    goal_topic: "/goal_pose"
    # Matches the working baseline, which feeds the existing cmd_vel_mux.
    cmd_vel_topic: "/cmd_vel_nav"
    global_frame: "map"
    base_frame: "base_link"
    control_frequency: 10.0
    use_tf: true
    publish_status: true

    robot:
      footprint_length: 0.375
      footprint_width: 0.36
      robot_radius: 0.22
      use_circular_footprint: false
      footprint_offset_x: 0.0
      footprint_offset_y: 0.0
      footprint_inflation: 0.06
      footprint_min_inflation: 0.02
      max_linear_speed: 0.22
      max_reverse_speed: 0.12
      max_angular_speed: 1.0
      max_linear_accel: 0.35
      max_linear_decel: 0.6
      max_angular_accel: 2.0

    lidar:
      min_range: 0.1
      max_range: 12.0
      max_usable_range: 4.0
      neighbour_radius: 0.18
      min_neighbours: 1
      neighbour_window: 2
      neighbour_spacing_factor: 1.5
      median_window: 3
      speckle_min_range: 0.5
      decimation: 1
      min_valid_fraction: 0.5
      field_of_view: 6.283185

    cluster:
      base_threshold: 0.1
      range_factor: 0.06
      min_points: 2
      max_cluster_radius: 0.12
      max_obstacles: 150
      structure_extent: 0.8

    tracker:
      association_gate: 0.45
      size_gate: 0.6
      alpha: 0.55
      beta: 0.3
      velocity_window: 0.6
      min_velocity_span: 0.3
      max_misses: 3
      min_hits_for_velocity: 3
      max_track_speed: 3.0
      moving_speed_threshold: 0.2
      max_dt: 1.0

    risk:
      caution_distance: 1.2
      danger_distance: 0.6
      critical_distance: 0.25
      caution_ttc: 4.0
      danger_ttc: 2.0
      critical_ttc: 0.8
      rear_weight: 0.1
      scale_clear: 1.0
      scale_caution: 0.6
      scale_danger: 0.3
      scale_critical: 0.0

    velocity:
      nominal_speed: 0.2
      min_progress_speed: 0.05
      brake_margin: 0.1
      brake_sector: 1.31
      smoothing: 0.55

    planner:
      sim_time: 3.0
      sim_step: 0.25
      slight_turn: 0.35
      strong_turn: 0.8
      slight_turn_speed: 0.8
      strong_turn_speed: 0.45
      slow_forward_speed: 0.45
      headway_distance: 1.6
      headway_step: 0.2
      point_grid: 0.05
      clearance_saturation: 1.0
      weight_goal: 2.2
      weight_heading: 1.1
      weight_clearance: 1.3
      weight_headway: 1.8
      weight_speed: 0.7
      weight_smoothness: 0.5

    safety:
      scan_timeout: 0.5
      odom_timeout: 0.6
      require_odom: true
      estop_distance: 0.18
      estop_ttc: 0.45
      estop_clear_distance: 0.3
      estop_min_duration: 0.5
      max_linear_speed: 0.25
      max_angular_speed: 1.2
      max_linear_jump: 0.1
      max_angular_jump: 0.35
      recovery_enabled: true
      recovery_reverse_speed: 0.12
      recovery_reverse_time: 0.8
      recovery_rotate_speed: 0.4
      recovery_rotate_time: 1.5
      recovery_max_attempts: 3
      recovery_rear_clearance: 0.3
      stuck_speed: 0.03
      stuck_time: 5.0

    goal:
      xy_tolerance: 0.2
      align_final_yaw: false
      yaw_tolerance: 0.35
      goal_timeout: 300.0
      progress_timeout: 45.0

    logging:
      enabled: true
      directory: "beetlebot_logs"
      flush_every: 20
